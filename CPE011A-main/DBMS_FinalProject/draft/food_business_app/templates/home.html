<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome {{ full_name }}</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fdf6e3;
      color: #4b3832;
      padding: 40px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #fffaf0;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    h1, h2, h3 {
      border-bottom: 1px solid #e0d5c0;
      padding-bottom: 8px;
    }

    .logout-link {
      float: right;
      font-size: 0.9em;
      color: #6f4e37;
      text-decoration: none;
    }

    .logout-link:hover {
      text-decoration: underline;
    }

    .menu-columns {
      display: flex;
      gap: 30px;
    }

    .menu-item {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="number"] {
      width: 60px;
    }

    input, select {
      padding: 6px;
      margin-top: 4px;
      border: 1px solid #c19a6b;
      border-radius: 4px;
    }

    button {
      padding: 10px 20px;
      background-color: #6f4e37;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
    }

    button:hover {
      background-color: #556b2f;
    }

    .section {
      margin: 25px 0;
      padding: 15px;
      border-radius: 8px;
      background-color: #fffaf0;
      border-left: 5px solid #c19a6b;
    }

    .menu-columns > div:nth-child(1) h3 {
      color: #8fbc8f; /* Tea */
    }

    .menu-columns > div:nth-child(2) h3 {
      color: #5c4033; /* Coffee */
    }

    .menu-columns > div:nth-child(3) h3 {
      color: #db7093; /* Dessert */
    }

    .back-button {
      margin-bottom: 20px;
      background-color: #9e9e9e;
    }

    .back-button:hover {
      background-color: #7b7b7b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome, {{ full_name }} <a href="{{ url_for('logout') }}" class="logout-link">Logout</a></h1>

    <button class="back-button" onclick="history.back()">← Back</button>

    <div class="section">
      <p><strong>Name:</strong> {{ full_name }}</p>
      <p><strong>Address:</strong> {{ address }}</p>
    </div>

    <form method="POST">
      <!-- Order Type -->
      <div class="section">
        <h3>Order Type</h3>
        <select name="order_type" required>
          <option value="">Select order type</option>
          <option value="Dine-in">Dine-in</option>
          <option value="Takeout">Takeout</option>
        </select>
      </div>

      <!-- Menu Items -->
      <div class="section">
        <h2>Menu Items</h2>
        <div class="menu-columns">
          {% for category in ['Tea', 'Coffee', 'Dessert'] %}
            <div>
              <h3>{{ category }}</h3>
              {% for item in menu_items if item['Category'] == category %}
                <div class="menu-item">
                  <label>
                    <input type="checkbox" name="item" value="{{ item['Item_ID'] }}">
                    {{ item['Item_Name'] }} (₱{{ '%.2f'|format(item['Price']) }})
                  </label>
                  Quantity:
                  <input type="number" name="quantity_{{ item['Item_ID'] }}" value="0" min="0">
                </div>
              {% endfor %}
            </div>
          {% endfor %}
        </div>
      </div>

      <!-- Special Order -->
      <div class="section">
        <h3>Special Order</h3>
        <input type="text" name="special_order" placeholder="Enter item not on menu" style="width: 100%;">
      </div>

      <!-- Delivery Date -->
      <div class="section">
        <h3>Delivery Date</h3>
        <input type="date" name="delivery_date" required>
      </div>

      <button type="submit">Place Order</button>
    </form>
  </div>
</body>
</html>
