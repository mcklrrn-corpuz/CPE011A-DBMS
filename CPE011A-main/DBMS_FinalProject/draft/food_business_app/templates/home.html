<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome {{ full_name }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }
        h1, h2, h3 {
            color: #333;
        }
        .menu-item {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 250px;
        }
        input[type="number"] {
            width: 60px;
        }
        .section {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .logout-link {
            float: right;
        }
    </style>
</head>
<body>

    <h1>Welcome, {{ full_name }}</h1>
    <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>

    <div class="section">
        <strong>Name:</strong> {{ full_name }}<br>
        <strong>Address:</strong> {{ address }}
    </div>

    <form method="POST">

        <!-- ✅ Menu Items -->
        <div class="section">
            <h2>Menu Items</h2>
            {% for item in menu_items %}
                <div class="menu-item">
                    <label>
                        <input type="checkbox" name="item" value="{{ item['Item_ID'] }}">
                        {{ item['Item_Name'] }} (₱{{ '%.2f'|format(item['Price']) }})
                    </label>
                    Quantity:
                    <input type="number" name="quantity_{{ item['Item_ID'] }}" value="0" min="0">
                </div>
            {% endfor %}
        </div>

        <!-- ✅ Special Order -->
        <div class="section">
            <h3>Special Order</h3>
            <input type="text" name="special_order" placeholder="Enter item not on menu" style="width: 300px;">
        </div>

        <!-- ✅ Delivery Date -->
        <div class="section">
            <h3>Delivery Date</h3>
            <input type="date" name="delivery_date" required>
        </div>

        <button type="submit">Place Order</button>
    </form>

</body>
</html>
